name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      # Pinned to commit SHAs to prevent supply-chain attacks (tag re-pointing).
      # Verify: https://github.com/actions/checkout/releases/tag/v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Python ${{ matrix.python-version }}
        # Pinned SHA — https://github.com/actions/setup-python/releases/tag/v5.3.0
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check src/ tests/

      - name: Type check with mypy
        if: matrix.python-version == '3.12'
        run: mypy src/roboarm/

      - name: Run tests
        run: pytest tests/ -v --cov=roboarm --cov-report=xml

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        # Pinned SHA — https://github.com/codecov/codecov-action/releases/tag/v4.6.0
        uses: codecov/codecov-action@1e68e06f1dbfde0e4cefc87efeba9e4643565303  # v4.6.0
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
